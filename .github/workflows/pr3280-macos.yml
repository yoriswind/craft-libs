name: PR 3280 focused macOS validation

on:
  push:
    branches: [codex/validation-3280-macos-ca3f03c5]

permissions:
  contents: read

concurrency:
  group: pr3280-macos-validation
  cancel-in-progress: false

jobs:
  update:
    name: craft-update macOS at 42817752
    runs-on: macos-26-intel
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CARGO_PROFILE_DEV_DEBUG: '0'
      CRAFT_FONTS_DIR: ${{ github.workspace }}/.test-inputs/craft-fonts
      CRAFT_FONTS_REQUIRED: '1'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the exact product source
        uses: actions/checkout@v7.0.1
        with:
          repository: yoriswind/craft-libs
          ref: 428177528ca5519e231f59fa4b54cd985b03a76c
          persist-credentials: false
      - name: Check out the existing Workspace font pin
        uses: actions/checkout@v7.0.1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: .test-inputs/craft-fonts
          persist-credentials: false
      - name: Verify execution identity and preinstalled Rust tools
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 428177528ca5519e231f59fa4b54cd985b03a76c
          test "$(git -C .test-inputs/craft-fonts rev-parse HEAD)" = b076417b5880bd4154bd22f00695b1d28c6bea83
          test "$RUNNER_OS" = macOS
          rustc --version
          cargo --version
          cargo clippy --version
          cargo fmt --version
          printf 'Product source: `%s`\n\nRunner: `%s` / `%s`\n' "$(git rev-parse HEAD)" "$RUNNER_OS" "$RUNNER_ARCH" >> "$GITHUB_STEP_SUMMARY"
      - name: Check package formatting
        run: cargo fmt --package craft-update -- --check
      - name: Compile and strictly lint default, UI and screen-testing targets
        run: |
          set -euo pipefail
          cargo clippy --no-deps --locked -p craft-update --all-targets --jobs 2 -- -D warnings
          cargo clippy --no-deps --locked -p craft-update --features ui --all-targets --jobs 2 -- -D warnings
          cargo clippy --no-deps --locked -p craft-update --features screen-testing --all-targets --jobs 2 -- -D warnings
      - name: Run eighteen exact registered error and macOS cases
        run: |
          set -euo pipefail
          cases=(
            'translate::tests::reloaded_compound_failures_translate_authored_frames_and_keep_data_opaque'
            'http::tests::a_rate_limited_release_check_is_typed_not_english_text'
            'http::tests::the_remote_agents_refuse_plain_http_before_connecting'
            'http::tests::https_only_still_reaches_a_loopback_link'
            'integration::update::the_update_dialogs_show_the_icon_the_app_gives_its_host'
            'integration::update::translatable_update_errors_are_rendered_by_the_check_dialog'
            'install::tests::install_reasons_keep_authored_context_and_external_data'
            'self_update::tests::restart_reasons_remain_structured_until_start'
            'install::tests::macos_checks::real_refusals_are_answers_from_codesign'
            'install::tests::macos_checks::a_job_canceled_while_it_waits_for_the_signature_check_stops_there'
            'install::macos::tests::detach_stderr_reaches_the_busy_retry_policy'
            'install::tests::a_busy_detach_retries_and_stops_as_soon_as_it_succeeds'
            'install::tests::a_detach_that_stays_busy_returns_its_last_error_after_bounded_retries'
            'install::tests::a_slow_busy_detach_spends_the_retry_window_without_another_attempt'
            'install::tests::a_detach_success_or_nonbusy_failure_never_waits_or_retries'
            'install::tests::macos_checks::only_mount_points_of_installs_that_ended_are_cleared'
            'install::tests::macos_checks::an_ended_mount_is_removed_after_a_busy_detach_succeeds'
            'install::tests::macos_checks::a_mount_that_stays_busy_is_left_after_bounded_cleanup'
          )
          i=0
          for case in "${cases[@]}"; do
            i=$((i + 1))
            log="$RUNNER_TEMP/pr3280-macos-case-$i.log"
            cargo test --locked -p craft-update --features screen-testing --lib --jobs 2 "$case" -- --test-threads=1 --exact 2>&1 | tee "$log"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' "$log"
            printf -- '- PASS: `%s` (one selected case)\n' "$case" >> "$GITHUB_STEP_SUMMARY"
          done
          test "$i" -eq 18
